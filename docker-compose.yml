

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waf_user
      POSTGRES_PASSWORD: waf_pass
      POSTGRES_DB: waf_db
    volumes:
      - waf_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf_user -d waf_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://waf_user:waf_pass@db:5432/waf_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/model:/app/model
      - ./ml_data:/app/ml_data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  waf_pg_data:
